<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ensemble project poster</title>
  <desc id="desc">Poster for the Ensemble matching concept.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7edf8"/>
      <stop offset="100%" stop-color="#f6d9d0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="852" cy="300" r="138" fill="#a65b79" opacity=".82"/>
  <circle cx="964" cy="300" r="138" fill="#d78356" opacity=".74"/>
  <circle cx="908" cy="196" r="138" fill="#7f6fd1" opacity=".68"/>
  <text x="82" y="152" fill="#8c687c" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="6">ENSEMBLE</text>
  <text x="82" y="294" fill="#37222b" font-family="Georgia, serif" font-size="122">Matching</text>
  <text x="82" y="398" fill="#735262" font-family="Arial, Helvetica, sans-serif" font-size="34">A concept for helping local musicians find collaborators and creative overlap.</text>
