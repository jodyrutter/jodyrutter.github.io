<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ensemble project poster</title>
  <desc id="desc">Poster for the Ensemble matching concept.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7edf8"/>
      <stop offset="100%" stop-color="#f6d9d0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="862" cy="308" r="128" fill="#a65b79" opacity=".82"/>
  <circle cx="964" cy="308" r="128" fill="#d78356" opacity=".74"/>
  <circle cx="912" cy="214" r="128" fill="#7f6fd1" opacity=".68"/>
  <text x="120" y="166" fill="#8c687c" font-family="Arial, Helvetica, sans-serif" font-size="34" letter-spacing="5">ENSEMBLE</text>
  <text x="120" y="308" fill="#37222b" font-family="Georgia, serif" font-size="108">Matching</text>
  <text x="120" y="394" fill="#735262" font-family="Arial, Helvetica, sans-serif" font-size="30">Musicians</text>
  <text x="120" y="466" fill="#735262" font-family="Arial, Helvetica, sans-serif" font-size="28">A concept for helping local musicians find collaborators nearby.</text>
</svg>
