<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tenex poll book systems poster</title>
  <desc id="desc">Poster representing software engineering for poll book systems.</desc>
