<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Freelance studio poster</title>
  <desc id="desc">Poster for independent client work and full-stack builds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0eee8"/>
      <stop offset="100%" stop-color="#d9eadf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="730" y="72" width="370" height="370" rx="46" fill="#1c8c80" opacity=".9"/>
  <rect x="782" y="126" width="264" height="264" rx="32" fill="#f6fbfa"/>
  <path d="M846 240h136M846 296h136M846 352h88" stroke="#1c8c80" stroke-width="16" stroke-linecap="round"/>
  <text x="82" y="150" fill="#48605f" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="6">SELF-EMPLOYED</text>
  <text x="82" y="298" fill="#13232d" font-family="Georgia, serif" font-size="124">Freelance</text>
  <text x="82" y="406" fill="#526969" font-family="Arial, Helvetica, sans-serif" font-size="34">Clients, product ideas, and quick paths from concept to working software.</text>
  <g transform="translate(80 522)">
    <rect width="560" height="140" rx="32" fill="#ffffff" opacity=".72" stroke="#bfd4c8"/>
    <text x="46" y="68" fill="#13232d" font-family="Arial, Helvetica, sans-serif" font-size="34">React  ·  React Native  ·  Django  ·  Full-stack</text>
    <text x="46" y="112" fill="#5b7170" font-family="Arial, Helvetica, sans-serif" font-size="28">Independent execution with product-minded communication.</text>
  </g>
