  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f1efe8"/>
      <stop offset="100%" stop-color="#dbeadf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="758" y="86" width="306" height="366" rx="44" fill="#1c8c80" opacity=".92"/>
