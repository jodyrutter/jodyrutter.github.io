    <path d="M48 84h424" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
    <path d="M92 44h82M248 44h120M436 44h36" stroke="#d7ece8" stroke-width="10" stroke-linecap="round" opacity=".72"/>
